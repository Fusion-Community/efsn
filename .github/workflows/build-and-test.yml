name: Build-And-Test
on: [push]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v3
      with:
        go-version: '1.27.3'
        check-latest: true
    - run: make all
    - run: go test -race -count=1 ./internal/ticketgzip ./internal/logjson
